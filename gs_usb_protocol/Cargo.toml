[package]
name = "gs_usb_protocol"
description = "The gs_usb USB to CAN protocol (Geschwister Schneider, candleLight, Linux's gs_usb): requests, structures and frames, for hosts and devices"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aeolionics-rs/can_usb_rs.git"
keywords = ["can", "gs_usb", "candlelight", "usb", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
